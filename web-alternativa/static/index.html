<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morse Pi</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
  button{font-size:1.1rem;padding:12px 16px;border-radius:10px;border:0;margin:4px 0;width:100%}
  .go{background:#3b82f6;color:#fff} .alt{background:#333;color:#eee}
  input{width:100%;box-sizing:border-box;font-size:1.1rem;padding:12px;border-radius:10px;border:0}
  #morse{font-family:monospace;font-size:1.4rem;word-break:break-all;color:#fbbf24}
  #text{font-size:1.6rem;margin:8px 0}
  label{display:block;margin:6px 0}
  small{color:#999}
</style>
</head>
<body>
<div id="flash"></div>
<h2>Código Morse – Raspberry Pi</h2>

<button class="go" id="enable">1) Ativar lanterna e som</button>
<small id="status">Toque no botão acima primeiro (o navegador exige).</small>

<label><input type="checkbox" id="optTorch" checked> Lanterna</label>
<label><input type="checkbox" id="optScreen" checked> Tela piscando (se não houver lanterna)</label>
<label><input type="checkbox" id="optSound" checked> Som no celular</label>
<label><input type="checkbox" id="optVib" checked> Vibração</label>

<hr>
<input id="msg" placeholder="Digite um texto (ou código Morse)">
<button class="go" id="send">Enviar</button>
<button class="alt" id="mic">🎤 Ouvir microfone da Pi: desligado</button>

<hr>
<div id="heard"><small>Ouvido:</small></div>
<div id="text">—</div>
<div id="morse">—</div>

<script>
const $ = id => document.getElementById(id);
let track = null, audioCtx = null, osc = null, gain = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));

$("enable").onclick = async () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator(); gain = audioCtx.createGain();
  osc.frequency.value = 700; gain.gain.value = 0;
  osc.connect(gain).connect(audioCtx.destination); osc.start();
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    track = s.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) { track.stop(); track = null; throw new Error("sem torch"); }
    $("status").textContent = "Lanterna pronta ✔";
  } catch (e) {
    $("status").textContent = "Lanterna indisponível (precisa de Chrome no Android + HTTPS). Usando a tela.";
  }
};

async function setLight(on) {
  if (track && $("optTorch").checked)
    track.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});
  else if ($("optScreen").checked) $("flash").style.opacity = on ? 1 : 0;
  if (gain && $("optSound").checked) gain.gain.setTargetAtTime(on ? 0.5 : 0, audioCtx.currentTime, 0.005);
}

async function play(timeline) {
  for (const [on, ms] of timeline) {
    setLight(!!on);
    if (on && $("optVib").checked && navigator.vibrate) navigator.vibrate(ms);
    await sleep(ms);
  }
  setLight(false);
}

const es = new EventSource("/events");
es.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.heard) $("heard").innerHTML = "<small>Ouvido:</small> " + d.heard;
  if (d.timeline) {
    $("text").textContent = d.text;
    $("morse").textContent = d.morse;
    play(d.timeline);
  }
};

$("send").onclick = () => {
  const text = $("msg").value.trim();
  if (text) fetch("/send", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
};
$("msg").onkeydown = e => { if (e.key === "Enter") $("send").click(); };

let listening = false;
$("mic").onclick = async () => {
  const r = await fetch("/listen", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({on:!listening})});
  const j = await r.json();
  if (!j.ok) return alert(j.error);
  listening = j.listening;
  $("mic").textContent = "🎤 Ouvir microfone da Pi: " + (listening ? "LIGADO" : "desligado");
};
</script>
</body>
</html>
